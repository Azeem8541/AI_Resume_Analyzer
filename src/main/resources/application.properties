spring.application.name=ai-resume-analyzer

# ===============================
# MySQL Configuration
# All values below come from environment variables (see .env.example).
# Defaults after ':' are for local dev convenience only - override in real environments.
# ===============================

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_resume_analyzer}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA Configuration
# ===============================

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.jpa.show-sql=${SHOW_SQL:false}

spring.jpa.properties.hibernate.format_sql=false


# ===============================
# Server
# ===============================

server.port=${SERVER_PORT:8080}

# Resume Upload Folder
file.upload-dir=${UPLOAD_DIR:uploads/}

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Do not leak stack traces / internal error details in production
server.error.include-message=${ERROR_INCLUDE_MESSAGE:on_param}
server.error.include-binding-errors=${ERROR_INCLUDE_BINDING:on_param}
server.error.include-stacktrace=never
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Gemini API key
gemini.api.key=${GEMINI_API_KEY}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true